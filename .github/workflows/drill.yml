name: CI Security Drill

on:
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Write run report
        run: echo "Drill run on $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > run-report.txt

      - name: Upload run report artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: run-report.txt
